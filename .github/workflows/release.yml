name: Release Pi Desk

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.2.0-rc.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pi-desk-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    name: verify source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run

  package:
    name: package ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-15
            target: mac
            arch: arm64
          - name: macos-x64
            runner: macos-15-intel
            target: mac
            arch: x64
          - name: windows-x64
            runner: windows-2025
            target: win
            arch: x64
          - name: linux-x64
            runner: ubuntu-22.04
            target: linux
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set package version from release tag
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$RELEASE_TAG" == v* && -n "$version" ]]
          npm version "$version" --no-git-tag-version --allow-same-version
      - name: Build installer
        shell: bash
        env:
          # The first release line intentionally works without an Apple
          # Developer ID certificate. Once available, remove this override on
          # macOS and provide the signing/notarization secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          npm run build
          npx electron-builder --"${{ matrix.target }}" --"${{ matrix.arch }}" --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-dist
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-dist
        run: |
          set -euo pipefail
          flags=(--verify-tag --title "Pi Desk ${RELEASE_TAG}" --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" * "${flags[@]}" --repo "$GITHUB_REPOSITORY"
